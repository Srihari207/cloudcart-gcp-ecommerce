{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your CloudCart account
        </p>

        <form onsubmit="event.preventDefault(); loginUser();">

            <div class="form-group">

                <label for="login-email">
                    Email
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button">
                Login
            </button>

        </form>


        <p
            id="auth-message"
            class="auth-message">
        </p>


        <p class="auth-switch">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </p>

    </div>

</div>


<script
    type="module"
    src="{{ url_for('static', filename='auth.js') }}">
</script>

{% endblock %}
