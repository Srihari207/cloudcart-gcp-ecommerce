<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudCart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <div class="logged-out">
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('register') }}">Register</a>
</div>

<div class="logged-in" style="display: none;">

    <span>
        Welcome, <span class="user-email"></span>
    </span>

    <a href="/my-orders" id="my-orders-link">
        My Orders
    </a>

    <button type="button" onclick="logoutUser()">
        Logout
    </button>

</div>
  <a class="brand" href="{{ url_for('index') }}">☁ CloudCart</a>
  <form class="search" action="{{ url_for('index') }}">
    <input name="q" value="{{ request.args.get('q','') }}" placeholder="Search products...">
    <button>Search</button>
  </form>
  <a class="cart-link" href="{{ url_for('cart') }}">🛒 Cart ({{ cart_count }})</a>
</header>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash">{{ messages[0] }}</div>
  {% endif %}
{% endwith %}
<main class="container">{% block content %}{% endblock %}</main>
<footer>CloudCart • Flask + Google Cloud Run + Firestore</footer>

<script
    type="module"
    src="{{ url_for('static', filename='auth.js') }}">
</script>

</body>
</html>
